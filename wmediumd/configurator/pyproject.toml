[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wmediumd-configurator"
version = "0.1.0"
description = "Deterministic RF scenario compiler for the EasyMesh hwsim lab"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
wmdcfg = "wmdcfg.cli:main"
wmdcfg-rf-audit = "wmdcfg.rf_audit:main"
wmdcfg-rf-source-audit = "wmdcfg.rf_source_audit:main"
wmdcfg-survey-bridge = "wmdcfg.survey_bridge:main"
wmdcfg-rf-survey = "wmdcfg.rf_survey:main"
wmdcfg-rf-validate = "wmdcfg.rf_validate:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["wmdcfg*"]
